<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nice Excel · Offline Spreadsheet</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2b;--panel2:#182338;--line:#34445e;--text:#edf3ff;--muted:#a7b6ce;--accent:#7aa7ff;--green:#41c7a0;--cell:#151f32;--head:#22334d;--select:#7aa7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:7px 10px;cursor:pointer;white-space:nowrap}button:hover{border-color:var(--accent);background:#20314d}button.primary{background:#275bc4;border-color:#477de5}button:disabled{opacity:.45;cursor:default}.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}.brand{font-weight:800;font-size:17px;letter-spacing:.2px;margin-right:8px}.brand span{color:var(--green)}.actions{display:flex;gap:6px;flex-wrap:wrap}.status{margin-left:auto;color:var(--muted);font-size:12px}.ribbon{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#10182a;border-bottom:1px solid var(--line);flex-wrap:wrap}.ribbon input[type=color]{width:32px;height:31px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:2px}.formula{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}#address{width:78px;text-align:center;background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:8px;font-weight:700}#formula{flex:1;min-width:80px;background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:8px}.gridwrap{flex:1;overflow:auto;position:relative;background:#0d1423}.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%;width:max-content;background:var(--cell)}.grid th,.grid td{height:30px;min-width:104px;max-width:260px;border-right:1px solid #34445e;border-bottom:1px solid #34445e;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}.grid thead th,.grid .rowhead{position:sticky;background:var(--head);z-index:2;text-align:center;color:#b7c8e4;font-weight:650}.grid thead th{top:0}.grid .rowhead{left:0;min-width:46px;width:46px;z-index:3}.grid thead th:first-child{left:0;z-index:4;min-width:46px;width:46px}.grid td{background:var(--cell);color:var(--text);outline:none;line-height:1.25}.grid td:focus,.grid td.selected{box-shadow:inset 0 0 0 2px var(--select);background:#192b46}.grid td.editing{padding:0;overflow:hidden;position:relative}.grid td.editing input{display:block;box-sizing:border-box;width:100%;height:100%;min-height:28px;margin:0;border-radius:0}.grid td input{width:100%;height:100%;min-height:28px;background:#101a2d;border:2px solid var(--select);outline:none;padding:2px 5px;color:var(--text);font:inherit;line-height:1.2;border-radius:0}.sheets{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}.sheet-tab{border-radius:6px 6px 0 0}.sheet-tab.active{background:#284b7b;border-color:#6398e9;color:white}.foot{padding:6px 12px;color:var(--muted);font-size:12px;background:#0c1322;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.note{color:#f2c66d}.hidden{display:none!important}@media(max-width:650px){
 .top{padding:6px 8px;gap:6px;align-items:flex-start}.brand{width:auto;font-size:15px;margin:0;align-self:center}.actions{gap:4px;flex:1}.actions button{font-size:12px;padding:5px 7px;border-radius:6px}.status{width:100%;margin:0;font-size:11px;order:3}
 .ribbon{padding:5px 7px;gap:5px;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain}.ribbon button,.ribbon select{font-size:12px;padding:5px 7px;flex:0 0 auto}.ribbon input[type=color]{width:27px;height:27px}.formula{padding:5px 7px;gap:5px}.formula #address{width:58px;padding:6px 3px;font-size:12px}.formula #formula{min-width:0;padding:7px 6px;font-size:13px}.formula button{padding:6px 9px}.grid th,.grid td{min-width:76px;height:30px;padding:3px 5px;font-size:12px}.grid .rowhead,.grid thead th:first-child{min-width:38px;width:38px}.grid td input{height:27px;font-size:12px}.sheets{padding:5px 7px;gap:4px}.sheets button{font-size:12px;padding:5px 7px}.foot{font-size:10px;padding:5px 7px;gap:5px}.note{max-width:60%;text-align:right}
}

.toolgroup{position:relative;flex:0 0 auto}.toolgroup>summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:7px 10px;white-space:nowrap}.toolgroup>summary::-webkit-details-marker{display:none}.toolmenu{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:220px;max-width:min(92vw,420px);max-height:55dvh;overflow:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px #0008}.toolmenu button,.toolmenu select{max-width:100%}.toolmenu input[type=color]{width:30px;height:30px}.top{padding:6px 8px;gap:6px}.brand{font-size:15px}.ribbon{display:none!important}
@media(max-width:650px){.top{align-items:center;flex-wrap:wrap}.toolgroup>summary{font-size:12px;padding:6px 8px}.toolmenu{position:fixed;left:8px;right:8px;top:155px;max-width:none;max-height:45dvh}.status{width:100%;order:10}}


/* Compact Excel-style two-row ribbon: section tabs, then one horizontal tool strip. */
.web-native-toolbar{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;overflow-x:auto;overflow-y:visible;padding:3px 7px 0;background:#115e39;border:0;min-height:38px;scrollbar-width:none;position:relative;z-index:20}
.web-native-toolbar::-webkit-scrollbar{display:none}
.web-native-toolbar .toolgroup{position:static;flex:0 0 auto}
.web-native-toolbar .toolgroup>summary{list-style:none;border:0;background:transparent;border-radius:5px 5px 0 0;color:#fff;font-size:13px;padding:8px 10px;white-space:nowrap}
.web-native-toolbar .toolgroup>summary::-webkit-details-marker{display:none}
.web-native-toolbar .toolgroup>summary:hover,.web-native-toolbar .toolgroup[open]>summary{background:#176d46;box-shadow:inset 0 -2px #9be7c4}
.web-native-toolbar .toolmenu{display:none;position:fixed;left:4px;right:4px;top:100px;width:auto;min-width:0;max-width:none;max-height:46dvh;overflow-x:auto;overflow-y:auto;flex-wrap:nowrap;align-items:center;gap:5px;padding:7px 8px;background:var(--panel);color:var(--text);border:0;border-bottom:1px solid var(--line);box-shadow:0 3px 8px #0002;z-index:30;white-space:nowrap}
.web-native-toolbar .toolgroup[open] .toolmenu{display:flex}
.toolmenu.portal-open{display:flex!important;z-index:9999;overflow-x:auto;overflow-y:auto;white-space:nowrap;box-sizing:border-box;background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 6px 20px #0004;border-radius:8px}
.web-native-toolbar .toolmenu button,.web-native-toolbar .toolmenu select{flex:0 0 auto;color:var(--text);background:var(--panel2);border-color:var(--line);padding:6px 8px;font-size:12px;min-height:31px}
.web-native-toolbar .toolmenu button.primary{background:#275bc4;color:#fff;border-color:#477de5}
.web-native-toolbar .toolmenu input[type=color]{flex:0 0 auto;width:30px;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.web-native-toolbar .toolmenu label{display:flex;align-items:center;flex:0 0 auto}
.web-native-toolbar .status{display:none}
@media(max-width:650px){.web-native-toolbar{padding:2px 4px 0;min-height:35px;gap:0}.web-native-toolbar .toolgroup>summary{font-size:12px;padding:8px 8px}.web-native-toolbar .toolmenu{position:fixed;left:4px;right:4px;top:100px;width:auto;max-height:38dvh;overflow-x:auto;overflow-y:auto;padding:5px 6px;gap:4px}.web-native-toolbar .toolmenu button,.web-native-toolbar .toolmenu select{font-size:11px;padding:5px 7px;min-height:29px}.web-native-toolbar .toolmenu input[type=color]{width:27px;height:27px}}
@media(min-width:651px){.web-native-toolbar .toolmenu{position:fixed;left:4px;right:4px;top:100px;width:auto;max-height:45dvh}}


/* Clearly highlight the currently open Excel ribbon section. */
.web-native-toolbar .toolgroup>summary{transition:background-color .12s ease,color .12s ease; border:1px solid transparent;}
.web-native-toolbar .toolgroup[open]>summary{background:#d1fae5!important;color:#064e3b!important;font-weight:800;border-color:#6ee7b7;box-shadow:inset 0 -3px #10b981,0 0 0 1px #10b981;}
.web-native-toolbar .toolgroup[open]{z-index:30}
</style></head>
<body>
<header class="top web-native-toolbar" aria-label="Nice Excel main menu">
<details class="toolgroup"><summary>File</summary><div class="toolmenu"><button class="primary" id="newBtn">New workbook</button><button id="recoverBtn">Recover</button><button id="openBtn">Open workbook…</button><button id="saveBtn">Save XLSX</button><button id="csvBtn">Export CSV…</button></div></details>
<details class="toolgroup"><summary>Home</summary><div class="toolmenu"><button id="undoBtn">Undo</button><button id="redoBtn">Redo</button><button id="homeFormatBtn">Cell formatting…</button><button id="findBtn">Find / Replace…</button></div></details>
<details class="toolgroup"><summary>Insert</summary><div class="toolmenu"><button id="insertRowBtn">Add row</button><button id="addSheetMenu">Add worksheet</button><button id="mergeBtn">Merge range</button><button id="chartBtn">Insert chart</button></div></details>
<details class="toolgroup"><summary>Format</summary><div class="toolmenu format-menu"><button id="boldBtn"><b>B</b></button><button id="italicBtn"><i>I</i></button><label title="Font color"><input id="fontColor" type="color" value="#edf3ff" aria-label="Font color"></label><label title="Cell fill"><input id="fillColor" type="color" value="#243b5b" aria-label="Cell fill"></label><select id="align" aria-label="Horizontal alignment"><option value="general">General</option><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select><select id="numberFormat" aria-label="Number format"><option value="General">General</option><option value="0">Number</option><option value="0.00">Number (2 decimals)</option><option value="0%">Percent</option><option value="$#,##0.00">Currency</option><option value="yyyy-mm-dd">Date</option></select><button id="applyStyle">Apply format</button></div></details>
<details class="toolgroup"><summary>Data</summary><div class="toolmenu"><button id="findBtnData" type="button">Find / Replace</button><button id="freezeBtn">Freeze panes</button><button id="dependenciesBtn">Dependencies</button></div></details>
<details class="toolgroup"><summary>Formula</summary><div class="toolmenu"><button id="calculateBtn">ƒx Calculate</button><button id="dependenciesBtnFormula" type="button">Dependencies</button><button id="formulaHelpBtn" type="button">Formula help</button></div></details>
<details class="toolgroup"><summary>View</summary><div class="toolmenu"><button id="nativeExcelBtn">Native Excel</button><button id="workbookInfoBtn">Workbook info</button></div></details>
<input class="hidden" id="fileInput" type="file" accept=".xlsx,.xlsm,.csv"><div class="status" id="status">Starting local workbook…</div></header>
<section class="formula"><input id="address" value="A1" aria-label="Cell address"><span style="color:var(--muted)">fx</span><input id="formula" placeholder="Enter value or formula (e.g. =SUM(A1:A5))" aria-label="Cell value or formula"><button id="applyCell" class="primary">✓</button></section>
<div id="formulaPreview" role="status" aria-live="polite" style="padding:3px 12px;min-height:22px;background:var(--panel);color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)">Formula preview appears while typing a formula.</div>
<div class="gridwrap" id="gridwrap"><table class="grid" id="grid" aria-label="Spreadsheet grid"></table></div>
<nav class="sheets" id="sheets"><button id="addSheet">＋ Sheet</button><button id="renameSheetTab">Rename</button><button id="deleteSheetTab">Delete</button></nav>
<footer class="foot"><span id="selectionInfo">A1 selected</span><span class="note" id="calcNote">Formula subset calculates locally; not full Excel compatibility.</span></footer>
<script>
(() => {
 const $=id=>document.getElementById(id); let bookId=null, activeSheet='Sheet1', selected='A1', data=[], sheets=[], editing=false;
 const COLS=20, ROWS=40;
 function colName(n){let s='';while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
 function addr(c,r){return colName(c)+r}
 function setStatus(s){$('status').textContent=s}
 function rememberBook(){try{if(bookId)localStorage.setItem('niceexcel.lastWorkbookId',bookId)}catch{}}
 function forgetBook(){try{localStorage.removeItem('niceexcel.lastWorkbookId')}catch{}}
 async function api(path,options={}){const r=await fetch(path,options);if(!r.ok){let msg='Request failed ('+r.status+')';try{const j=await r.json();msg=j.detail||msg}catch{}throw Error(msg)}const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.blob()}
 function json(method,body){return {method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}}
 async function create(){const x=await api('/workbooks',json('POST',{sheet_name:'Sheet1'}));bookId=x.workbook_id;activeSheet=x.sheets[0];sheets=x.sheets;selected='A1';rememberBook();await refresh();setStatus('New workbook ready')}
 async function info(){const x=await api('/workbooks/'+bookId);sheets=x.sheets.map(s=>s.name);if(!sheets.includes(activeSheet))activeSheet=sheets[0]||'Sheet1';renderSheets();}
 async function refresh(){if(!bookId)return;await info();const x=await api('/workbooks/'+bookId+'/range?sheet='+encodeURIComponent(activeSheet)+'&range=A1:T40');data=x.rows;renderGrid();syncFormula();}
 function cellAt(a){const m=a.match(/^([A-Z]+)(\d+)$/);if(!m)return null;let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return {r:+m[2],c}}
 function cellData(a){const p=cellAt(a);return p&&data[p.r-1]&&data[p.r-1][p.c-1]}
 function renderGrid(){const t=$('grid');t.innerHTML='';const thead=document.createElement('thead'),hr=document.createElement('tr');const corner=document.createElement('th');corner.textContent='▦';hr.append(corner);for(let c=1;c<=COLS;c++){const th=document.createElement('th');th.textContent=colName(c);hr.append(th)}thead.append(hr);t.append(thead);const tb=document.createElement('tbody');for(let r=1;r<=ROWS;r++){const tr=document.createElement('tr'),rh=document.createElement('th');rh.className='rowhead';rh.textContent=r;tr.append(rh);for(let c=1;c<=COLS;c++){const a=addr(c,r),obj=data[r-1]?.[c-1]||{value:null,style:{}};const td=document.createElement('td');td.dataset.addr=a;td.tabIndex=0;const displayValue=(typeof obj.value==='string'&&obj.value.startsWith('='))?obj.calculated_value:obj.value;td.textContent=displayValue==null?'':String(displayValue);td.title=obj.value==null?'':String(obj.value);if(obj.style){if(obj.style.bold)td.style.fontWeight='700';if(obj.style.italic)td.style.fontStyle='italic';if(obj.style.font_color)td.style.color='#'+obj.style.font_color.slice(-6);if(obj.style.fill_color)td.style.background='#'+obj.style.fill_color.slice(-6);if(obj.style.horizontal)td.style.textAlign=obj.style.horizontal;if(obj.number_format&&obj.number_format!=='General')td.dataset.numberFormat=obj.number_format}if(a===selected)td.classList.add('selected');td.addEventListener('click',()=>select(a));td.addEventListener('dblclick',()=>editCell(td));td.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='F2'){e.preventDefault();editCell(td)}else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&!editing){e.preventDefault();move(e.key)}});tr.append(td)}tb.append(tr)}t.append(tb)}
 function select(a){selected=a.toUpperCase();$('address').value=selected;document.querySelectorAll('td.selected').forEach(x=>x.classList.remove('selected'));const el=document.querySelector('td[data-addr="'+selected+'"]');if(el)el.classList.add('selected');syncFormula();$('selectionInfo').textContent=activeSheet+' · '+selected}
 function syncFormula(){const obj=cellData(selected);$('formula').value=obj?.value??'';$('address').value=selected;scheduleFormulaPreview()}
 function move(k){const p=cellAt(selected);if(!p)return;let {r,c}=p;if(k==='ArrowUp')r=Math.max(1,r-1);if(k==='ArrowDown')r=Math.min(ROWS,r+1);if(k==='ArrowLeft')c=Math.max(1,c-1);if(k==='ArrowRight')c=Math.min(COLS,c+1);select(addr(c,r));document.querySelector('td[data-addr="'+selected+'"]').focus()}
 function editCell(td){if(editing)return;editing=true;const a=td.dataset.addr,old=cellData(a)?.value??'';td.classList.add('editing');const inp=document.createElement('input');inp.value=old;td.textContent='';td.append(inp);inp.focus();inp.select();const done=async save=>{if(!editing)return;editing=false;const val=inp.value; if(save){try{await api('/workbooks/'+bookId+'/cells',json('PATCH',{sheet:activeSheet,cells:[{cell:a,value:val===''?null:val}]}));setStatus('Saved '+a)}catch(e){alert(e.message)}}await refresh();select(a)};inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done(true)}if(e.key==='Escape')done(false)});inp.addEventListener('blur',()=>done(true))}
 async function applyCell(){const a=$('address').value.trim().toUpperCase();if(!/^[A-Z]{1,3}[1-9][0-9]*$/.test(a)){alert('Enter a valid cell address, e.g. A1');return}selected=a;try{await api('/workbooks/'+bookId+'/cells',json('PATCH',{sheet:activeSheet,cells:[{cell:a,value:$('formula').value===''?null:$('formula').value}]}));await refresh();select(a);setStatus('Saved '+a)}catch(e){alert(e.message)}}
 let previewTimer=null,previewRequest=0;
 function scheduleFormulaPreview(){
   if(previewTimer)clearTimeout(previewTimer);
   const formula=$('formula').value, cell=$('address').value.trim().toUpperCase(), out=$('formulaPreview');
   const requestId=++previewRequest;
   if(!formula.startsWith('=')){out.textContent=formula===''?'':('Value: '+formula);out.style.color='var(--muted)';return}
   out.textContent='Calculating preview…';out.style.color='var(--muted)';
   previewTimer=setTimeout(async()=>{
     if(!bookId||requestId!==previewRequest)return;
     try{const result=await api('/workbooks/'+bookId+'/formula-preview',json('POST',{sheet:activeSheet,cell,formula}));
       if(requestId!==previewRequest)return;
       const value=result.calculated_value;
       if(result.formula_error){out.textContent='Formula error: '+result.formula_error;out.style.color='#ff8a8a'}
       else{out.textContent='Preview result: '+(value===null||value===undefined?'':String(value));out.style.color='var(--green)'}
     }catch(e){if(requestId===previewRequest){out.textContent='Preview unavailable: '+e.message;out.style.color='#ff8a8a'}}
   },300);
 }
 function renderSheets(){const nav=$('sheets');nav.querySelectorAll('.sheet-tab').forEach(x=>x.remove());const add=$('addSheet');for(const name of sheets){const b=document.createElement('button');b.className='sheet-tab'+(name===activeSheet?' active':'');b.textContent=name;b.onclick=async()=>{activeSheet=name;await refresh()};nav.insertBefore(b,add)} }
 async function download(path,filename,method='GET',body=null){const opts={method};if(body instanceof FormData)opts.body=body;else if(body!==null)Object.assign(opts,json(method,body));const blob=await api(path,opts);const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
 $('newBtn').onclick=()=>{if(bookId&&!confirm('Create a new workbook? The current workbook remains in Recovery.'))return;create().catch(e=>alert(e.message))};$('recoverBtn').onclick=async()=>{try{const result=await api('/recovery');const items=result.items||[];if(!items.length){setStatus('No recovery workbooks found');alert('No autosaved workbooks were found.');return}const listing=items.slice(0,30).map((x,i)=>(i+1)+'. '+x.sheets.join(', ')+' — '+new Date(x.modified*1000).toLocaleString()).join('\n');const answer=prompt('Choose workbook number to recover:\n\n'+listing,'1');if(answer===null)return;const n=Number(answer);if(!Number.isInteger(n)||n<1||n>Math.min(items.length,30)){alert('Invalid recovery number');return}const item=items[n-1];const restored=await api('/recovery/'+item.workbook_id+'/restore',{method:'POST'});bookId=restored.workbook_id;activeSheet=restored.sheets[0]||'Sheet1';sheets=restored.sheets;selected='A1';rememberBook();await refresh();setStatus('Recovered workbook successfully')}catch(e){alert(e.message)}};$('openBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.name.toLowerCase().endsWith('.csv')){await create();const fd=new FormData();fd.append('file',f);await api('/workbooks/'+bookId+'/csv/'+encodeURIComponent(activeSheet)+'/import',{method:'POST',body:fd});await refresh()}else{const fd=new FormData();fd.append('file',f);const x=await api('/workbooks/open',{method:'POST',body:fd});bookId=x.workbook_id;activeSheet=x.sheets[0];sheets=x.sheets;rememberBook();await refresh()}setStatus('Opened '+f.name)}catch(err){alert(err.message)}finally{e.target.value=''}};
 $('undoBtn').onclick=async()=>{if(!bookId)return;try{const r=await api('/workbooks/'+bookId+'/undo',{method:'POST'});if(!r.undone){setStatus('Nothing to undo');return}await refresh();setStatus('Undo complete')}catch(e){alert(e.message)}};$('redoBtn').onclick=async()=>{if(!bookId)return;try{const r=await api('/workbooks/'+bookId+'/redo',{method:'POST'});if(!r.redone){setStatus('Nothing to redo');return}await refresh();setStatus('Redo complete')}catch(e){alert(e.message)}};
 $('dependenciesBtn').onclick=async()=>{if(!bookId)return;try{const g=await api('/workbooks/'+bookId+'/dependencies');const lines=['Formula dependency report','Formulas: '+g.formula_count,'Dependency links: '+g.dependency_edges,'Circular groups: '+g.cycle_count,''];if(g.cycle_count){lines.push('CIRCULAR REFERENCES:');g.cycles.slice(0,12).forEach(c=>lines.push(c.map(p=>p.sheet+'!'+p.cell).join(' → ')));}else lines.push('No circular formula references detected.');lines.push('','Formula details:');g.nodes.slice(0,40).forEach(n=>lines.push((n.in_cycle?'[CYCLE] ':'')+n.sheet+'!'+n.cell+' '+n.formula+' ← '+(n.dependencies.length?n.dependencies.map(p=>p.sheet+'!'+p.cell).join(', '):'no cell refs')));if(g.nodes.length>40)lines.push('… '+(g.nodes.length-40)+' more formulas');alert(lines.join('\n'));setStatus('Dependency graph: '+g.formula_count+' formulas · '+g.cycle_count+' circular groups');}catch(e){alert(e.message)}};
 $('calculateBtn').onclick=async()=>{if(!bookId)return;try{const result=await api('/workbooks/'+bookId+'/calculate',{method:'POST'});await refresh();setStatus('Calculated '+result.formulas_evaluated+' formulas · '+result.errors+' formula errors');if(result.errors){const preview=result.formula_errors.slice(0,8).map(x=>x.sheet+'!'+x.cell+': '+x.formula_error).join('\n');alert('Formula calculation finished with '+result.errors+' error(s).\n\n'+preview+(result.errors>8?'\n…':'')+'\n\nNote: Nice Excel supports a limited formula set; unsupported formulas show #NAME?.')} }catch(e){alert(e.message)}};$('saveBtn').onclick=()=>download('/workbooks/'+bookId+'/save','NiceExcel.xlsx').then(()=>setStatus('Workbook downloaded')).catch(e=>alert(e.message));$('csvBtn').onclick=()=>download('/workbooks/'+bookId+'/csv/'+encodeURIComponent(activeSheet),'NiceExcel-'+activeSheet+'.csv','POST').catch(e=>alert(e.message));$('applyCell').onclick=applyCell;$('formula').addEventListener('input',scheduleFormulaPreview);$('formula').addEventListener('keydown',e=>{if(e.key==='Enter')applyCell()});$('address').addEventListener('keydown',e=>{if(e.key==='Enter')select($('address').value.trim().toUpperCase())});
 $('insertRowBtn').onclick=async()=>{if(!bookId)return;const p=cellAt(selected);const row=p?p.r:1;try{await api('/workbooks/'+bookId+'/rows',json('POST',{sheet:activeSheet,row}));await refresh();select(addr(1,row));setStatus('Inserted row '+row)}catch(e){alert(e.message)}};
 $('nativeExcelBtn').onclick=()=>{try{if(window.NiceExcelNative&&window.NiceExcelNative.goNative)window.NiceExcelNative.goNative();else alert('Use the green header back arrow to return to Native Excel.')}catch(e){alert('Use the green header back arrow to return to Native Excel.')}};
 const addSheetAction=async()=>{const name=prompt('New worksheet name','Sheet'+(sheets.length+1));if(!name)return;try{await api('/workbooks/'+bookId+'/sheets',json('POST',{name}));activeSheet=name;await refresh()}catch(e){alert(e.message)}};$('addSheet').onclick=addSheetAction;$('addSheetMenu').onclick=addSheetAction;$('renameSheetTab').onclick=async()=>{const name=prompt('Rename worksheet',activeSheet);if(!name||name===activeSheet)return;try{await api('/workbooks/'+bookId+'/sheets',json('PATCH',{old_name:activeSheet,new_name:name}));activeSheet=name;await refresh()}catch(e){alert(e.message)}};$('deleteSheetTab').onclick=async()=>{if(sheets.length<2){alert('A workbook must have at least one sheet');return}if(!confirm('Delete worksheet '+activeSheet+'?'))return;try{const x=await api('/workbooks/'+bookId+'/sheets/'+encodeURIComponent(activeSheet),{method:'DELETE'});sheets=x.sheets;activeSheet=x.active_sheet;await refresh()}catch(e){alert(e.message)}};
 $('applyStyle').onclick=async()=>{const body={sheet:activeSheet,range:selected};const p=cellAt(selected);body.range=selected+':'+selected;body.bold=$('boldBtn').dataset.on==='1';body.italic=$('italicBtn').dataset.on==='1';body.font_color=$('fontColor').value;body.fill_color=$('fillColor').value;body.horizontal=$('align').value;body.number_format=$('numberFormat').value;try{await api('/workbooks/'+bookId+'/style',json('PATCH',body));await refresh();select(selected);setStatus('Formatting applied')}catch(e){alert(e.message)}};
 $('boldBtn').onclick=()=>{$('boldBtn').dataset.on=$('boldBtn').dataset.on==='1'?'0':'1';$('boldBtn').style.borderColor=$('boldBtn').dataset.on==='1'?'var(--accent)':'var(--line)'};$('italicBtn').onclick=()=>{$('italicBtn').dataset.on=$('italicBtn').dataset.on==='1'?'0':'1';$('italicBtn').style.borderColor=$('italicBtn').dataset.on==='1'?'var(--accent)':'var(--line)'};
 $('mergeBtn').onclick=async()=>{const range=prompt('Range to merge (e.g. A1:C1)',selected+':'+selected);if(!range)return;try{await api('/workbooks/'+bookId+'/merge',json('POST',{sheet:activeSheet,range}));await refresh();setStatus('Merged '+range)}catch(e){alert(e.message)}};$('freezeBtn').onclick=async()=>{const cell=prompt('Freeze panes at cell (A1 clears freeze)', 'A2');if(!cell)return;try{await api('/workbooks/'+bookId+'/freeze',json('PATCH',{sheet:activeSheet,cell}));setStatus('Freeze panes updated')}catch(e){alert(e.message)}};$('chartBtn').onclick=async()=>{const range=prompt('Chart data range; first column labels, first row series titles (e.g. A1:B6)','A1:B6');if(!range)return;const kind=(prompt('Chart type: bar, line, or pie','bar')||'bar').trim().toLowerCase();if(!['bar','line','pie'].includes(kind)){alert('Choose bar, line, or pie');return}const title=prompt('Chart title','Nice Excel Chart')||'Nice Excel Chart';const anchor=prompt('Chart position','G2')||'G2';try{await api('/workbooks/'+bookId+'/charts',json('POST',{sheet:activeSheet,range,chart_type:kind,title,anchor}));setStatus(kind+' chart added at '+anchor+' (included when saved)')}catch(e){alert(e.message)}};$('findBtn').onclick=async()=>{const find=prompt('Find text');if(find===null||find==='')return;const replace=prompt('Replace with (leave blank to remove)','');if(replace===null)return;try{const x=await api('/workbooks/'+bookId+'/find-replace',json('POST',{sheet:activeSheet,find,replace,match_case:false}));await refresh();alert('Updated '+x.replaced_cells+' cells')}catch(e){alert(e.message)}};

 // Menu aliases keep the native-style sections while reusing the existing feature handlers.
 $('homeFormatBtn').onclick=()=>{ $('boldBtn').dataset.on=$('boldBtn').dataset.on||'0'; $('applyStyle').click(); };
 $('findBtnData').onclick=()=> $('findBtn').click();
 $('dependenciesBtnFormula').onclick=()=> $('dependenciesBtn').click();
 $('formulaHelpBtn').onclick=()=>alert('Enter formulas in the formula bar, for example =SUM(A1:A5), =AVERAGE(A1:A5), =COUNT(A1:A5), or =IF(A1>5,"Yes","No"). Supported functions depend on the offline formula engine.');
 $('workbookInfoBtn').onclick=()=>setStatus('Workbook: '+(bookId||'not ready')+' · Sheet: '+activeSheet+' · '+sheets.length+' sheet(s)');
 // Ribbon behavior: one active section. Menus are portaled to body so the horizontally
 // scrollable tab strip cannot clip them on Android WebView/mobile browsers.
 (function setupCompactRibbon(){
   const groups=[...document.querySelectorAll('.web-native-toolbar details.toolgroup')];
   const closeGroup=(group)=>{
     const menu=group.querySelector('.toolmenu') || document.querySelector('.toolmenu[data-owner="'+groups.indexOf(group)+'"]');
     group.open=false;
     if(menu){menu.classList.remove('portal-open');menu.style.position='';menu.style.left='';menu.style.right='';menu.style.top='';menu.style.width='';menu.style.maxHeight='';menu.removeAttribute('data-owner');group.appendChild(menu);}
   };
   const shortLabels={newBtn:'＋ New',recoverBtn:'↻ Recover',openBtn:'Open XLSX',saveBtn:'Save XLSX',csvBtn:'Export CSV',undoBtn:'↶ Undo',redoBtn:'↷ Redo',homeFormatBtn:'Format…',findBtn:'Find',insertRowBtn:'＋ Row',addSheetMenu:'＋ Sheet',mergeBtn:'Merge',chartBtn:'Chart',boldBtn:'B',italicBtn:'I',applyStyle:'Apply',findBtnData:'Find',freezeBtn:'Freeze',dependenciesBtn:'Links',calculateBtn:'ƒx Calc',dependenciesBtnFormula:'Links',formulaHelpBtn:'Help',nativeExcelBtn:'Native Excel',workbookInfoBtn:'Info'};
   for(const group of groups){
     const summary=group.querySelector('summary');
     summary.setAttribute('role','button'); summary.setAttribute('aria-label',summary.textContent.trim()+' tools');
     group.querySelectorAll('.toolmenu button[id]').forEach(btn=>{const label=btn.textContent.trim();btn.title=label;btn.setAttribute('aria-label',label);if(shortLabels[btn.id])btn.textContent=shortLabels[btn.id];});
     group.querySelectorAll('.toolmenu select').forEach(el=>{el.style.maxWidth='118px';});
     group.addEventListener('toggle',()=>{
       if(group.open){
         groups.forEach(other=>{if(other!==group)closeGroup(other);});
         const menu=group.querySelector('.toolmenu');
         if(menu){
           menu.dataset.owner=String(groups.indexOf(group));
           menu.classList.add('portal-open');
           menu.style.position='fixed';menu.style.left='4px';menu.style.right='4px';menu.style.width='auto';
           menu.style.top=Math.ceil(group.closest('.web-native-toolbar').getBoundingClientRect().bottom)+'px';
           menu.style.maxHeight='45dvh';
           document.body.appendChild(menu);
         }
       }else{
         const menu=document.querySelector('.toolmenu[data-owner="'+groups.indexOf(group)+'"]');
         if(menu){menu.classList.remove('portal-open');menu.style.position='';menu.style.left='';menu.style.right='';menu.style.top='';menu.style.width='';menu.style.maxHeight='';menu.removeAttribute('data-owner');group.appendChild(menu);}
       }
     });
   }
   // Home is the compact default; users can tap any section to change the strip.
   const home=groups.find(g=>g.querySelector('summary')?.textContent.trim()==='Home');
   if(home && !groups.some(g=>g.open)) home.open=true;
   document.addEventListener('click',ev=>{if(!ev.target.closest('.web-native-toolbar')&&!ev.target.closest('.toolmenu'))groups.forEach(g=>{if(g.open)closeGroup(g)});});
 })();

 async function startSession(){let saved=null;try{saved=localStorage.getItem('niceexcel.lastWorkbookId')}catch{}if(saved){try{const x=await api('/workbooks/'+saved);bookId=saved;sheets=x.sheets.map(s=>s.name);activeSheet=x.active_sheet||sheets[0]||'Sheet1';selected='A1';await refresh();setStatus('Restored last workbook')}catch{forgetBook()}}if(!bookId)await create()}
 startSession().catch(e=>{setStatus('API error: '+e.message);$('calcNote').textContent='Start backend at 127.0.0.1:8765; see backend README.'});
})();
