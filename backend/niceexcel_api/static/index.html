<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nice Excel · Offline Spreadsheet</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2b;--panel2:#182338;--line:#2a3850;--text:#edf3ff;--muted:#94a5c2;--accent:#6d9cff;--green:#41c7a0;--cell:#111a2b;--head:#1b2940;--select:#7aa7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:7px 10px;cursor:pointer;white-space:nowrap}button:hover{border-color:var(--accent);background:#20314d}button.primary{background:#275bc4;border-color:#477de5}button:disabled{opacity:.45;cursor:default}.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}.brand{font-weight:800;font-size:17px;letter-spacing:.2px;margin-right:8px}.brand span{color:var(--green)}.actions{display:flex;gap:6px;flex-wrap:wrap}.status{margin-left:auto;color:var(--muted);font-size:12px}.ribbon{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#10182a;border-bottom:1px solid var(--line);flex-wrap:wrap}.ribbon input[type=color]{width:32px;height:31px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:2px}.formula{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}#address{width:78px;text-align:center;background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:8px;font-weight:700}#formula{flex:1;min-width:80px;background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:8px}
.formula-picker-toggle{flex:0 0 auto;white-space:nowrap;font-size:12px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text,#e5edf8)}
.formula-picker{position:relative;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 8px;box-shadow:0 5px 12px #0002}
.formula-picker[hidden]{display:none!important}.formula-search{box-sizing:border-box;width:100%;padding:7px 9px;margin-bottom:5px;background:#0b1220;border:1px solid var(--line);border-radius:6px;color:inherit;font-size:13px}
.formula-list{display:flex;flex-direction:column;max-height:220px;overflow-y:auto;overscroll-behavior:contain;gap:2px}
.formula-option{display:block;width:100%;text-align:left;padding:7px 9px;border:0;border-radius:4px;background:transparent;color:inherit;font-size:13px}
.formula-option:active,.formula-option:hover{background:var(--head)}
.gridwrap{flex:1;overflow:auto;position:relative;background:#0d1423}.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%;width:max-content}.grid th,.grid td{height:30px;min-width:104px;max-width:260px;border-right:1px solid #29364b;border-bottom:1px solid #29364b;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid thead th,.grid .rowhead{position:sticky;background:var(--head);z-index:2;text-align:center;color:#b7c8e4;font-weight:650}.grid thead th{top:0}.grid tbody tr.freeze-row td{position:sticky;z-index:1;background:var(--cell)}.grid tbody tr.freeze-row .rowhead{position:sticky;z-index:5;background:var(--head)}.grid tbody tr.freeze-row td.selected{z-index:2}.grid .rowhead{left:0;min-width:46px;width:46px;z-index:3}.grid thead th:first-child{left:0;z-index:4;min-width:46px;width:46px}.grid td{background:var(--cell);outline:none}.grid td:focus,.grid td.selected{box-shadow:inset 0 0 0 2px var(--select);background:#192b46}.grid td.editing{padding:0;overflow:visible}.grid td input{width:100%;height:29px;background:#101a2d;border:2px solid var(--select);outline:none;padding:3px 6px}.sheets{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}.sheet-tab{border-radius:6px 6px 0 0}.sheet-tab.active{background:#284b7b;border-color:#6398e9;color:white}.foot{padding:6px 12px;color:var(--muted);font-size:12px;background:#0c1322;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.note{color:#f2c66d}.hidden{display:none!important}@media(max-width:650px){
 .top{padding:6px 8px;gap:6px;align-items:flex-start}.brand{width:auto;font-size:15px;margin:0;align-self:center}.actions{gap:4px;flex:1}.actions button{font-size:12px;padding:5px 7px;border-radius:6px}.status{width:100%;margin:0;font-size:11px;order:3}
 .ribbon{padding:5px 7px;gap:5px;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain}.ribbon button,.ribbon select{font-size:12px;padding:5px 7px;flex:0 0 auto}.ribbon input[type=color]{width:27px;height:27px}.formula{padding:5px 7px;gap:5px}.formula #address{width:58px;padding:6px 3px;font-size:12px}.formula #formula{min-width:0;padding:7px 6px;font-size:13px}.formula button{padding:6px 9px}.grid th,.grid td{min-width:76px;height:28px;padding:3px 5px;font-size:12px}.grid .rowhead,.grid thead th:first-child{min-width:38px;width:38px}.grid td input{height:27px;font-size:12px}.sheets{padding:5px 7px;gap:4px}.sheets button{font-size:12px;padding:5px 7px}.foot{font-size:10px;padding:5px 7px;gap:5px}.note{max-width:60%;text-align:right}
}

/* Compact ribbon: tapping a section toggles one inline, horizontal tool row below the tabs. */
.web-native-toolbar{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:3px 7px 0;background:#115e39;border:0;min-height:38px;scrollbar-width:none;position:relative;z-index:20}
.web-native-toolbar::-webkit-scrollbar{display:none}
.web-native-toolbar .toolgroup{position:static;flex:0 0 auto}
.web-native-toolbar .toolgroup>summary{list-style:none;border:1px solid transparent;background:transparent;border-radius:5px 5px 0 0;color:#fff;font-size:13px;padding:8px 10px;white-space:nowrap;cursor:pointer;transition:background-color .12s ease,color .12s ease}
.web-native-toolbar .toolgroup>summary::-webkit-details-marker{display:none}
.web-native-toolbar .toolgroup>summary:hover{background:#176d46}
.web-native-toolbar .toolgroup.active>summary{background:#d1fae5!important;color:#064e3b!important;font-weight:800;border-color:#6ee7b7;box-shadow:inset 0 -3px #10b981}
/* Show the same clear selection indicator on options inside the active section. */
.inline-tools .toolmenu button.option-indicator-active,
.inline-tools .toolmenu select.option-indicator-active{
  background:#d1fae5!important;color:#064e3b!important;font-weight:800!important;
  border-color:#6ee7b7!important;box-shadow:inset 0 -3px #10b981!important;
  outline:1px solid rgba(16,185,129,.25);outline-offset:-1px;
}
.inline-tools .toolmenu button:focus-visible,
.inline-tools .toolmenu select:focus-visible{outline:2px solid #10b981;outline-offset:1px}

.inline-tools{display:none;align-items:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;min-height:0;padding:0 6px;background:#10182a;border-bottom:1px solid var(--line);white-space:nowrap;scrollbar-width:none}
.inline-tools.visible{display:flex;min-height:31px;padding-top:2px;padding-bottom:2px}
.inline-tools::-webkit-scrollbar{display:none}
.inline-tools .toolmenu{position:static;inset:auto;display:flex;align-items:center;flex-wrap:nowrap;gap:4px;min-width:max-content;padding:0;margin:0;border:0;background:transparent;box-shadow:none;border-radius:0;overflow:visible}
.inline-tools .toolmenu button,.inline-tools .toolmenu select{flex:0 0 auto;color:var(--text);background:var(--panel2);border-color:var(--line);padding:3px 6px;font-size:10px;min-height:25px}
.inline-tools .toolmenu button.primary{background:#275bc4;color:#fff;border-color:#477de5}
.inline-tools .toolmenu input[type=color]{flex:0 0 auto;width:23px;height:23px;padding:2px;border:1px solid var(--line);border-radius:5px;background:var(--panel2)}
.inline-tools .toolmenu label{display:flex;align-items:center;flex:0 0 auto}
.web-native-toolbar .status{display:none}
@media(max-width:650px){.web-native-toolbar{padding:2px 4px 0;min-height:35px;gap:0}.web-native-toolbar .toolgroup>summary{font-size:12px;padding:8px 8px}.inline-tools.visible{min-height:29px;padding:2px 4px}.inline-tools .toolmenu{gap:3px}.inline-tools .toolmenu button,.inline-tools .toolmenu select{font-size:10px;padding:3px 5px;min-height:24px}.inline-tools .toolmenu input[type=color]{width:22px;height:22px}}

/* Compact ribbon compatibility for the existing UI regression test. */
.toolgroup[open] .toolmenu{display:flex}

/* Smart Table wizard and in-grid filtering controls */
#smartTableDialog{width:min(560px,calc(100vw - 24px));border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:0;box-shadow:0 22px 70px #0009}
#smartTableDialog::backdrop{background:#020617bb;backdrop-filter:blur(3px)}
.st-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.st-head h2{margin:0;font-size:18px}.st-body{padding:16px 18px;display:grid;gap:12px}.st-field{display:grid;gap:5px}.st-field label{color:var(--muted);font-size:12px;font-weight:700}.st-field input,.st-field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#0b1220;color:var(--text);min-width:0}.st-checks{display:flex;flex-wrap:wrap;gap:14px}.st-checks label{display:flex;align-items:center;gap:7px}.st-styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.st-style{border:2px solid transparent;border-radius:8px;padding:7px;min-width:0;text-align:left}.st-style[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.st-swatch{height:8px;border-radius:3px;margin-bottom:6px}.st-style span{font-size:11px}.st-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.st-filterbar{display:none;align-items:center;gap:7px;flex-wrap:wrap;padding:7px 10px;background:#122b25;border-bottom:1px solid #28634d}.st-filterbar.visible{display:flex}.st-filterbar strong{font-size:12px;color:#a7f3d0}.st-filterbar select,.st-filterbar input{max-width:190px;min-width:90px;padding:6px 8px;border:1px solid #35634f;border-radius:6px;background:#0b1e19;color:var(--text)}.st-filterbar .st-filter-status{font-size:11px;color:#a7f3d0}
@media(max-width:650px){.st-body{padding:12px}.st-styles{grid-template-columns:repeat(4,minmax(0,1fr))}.st-filterbar{gap:5px;padding:5px}.st-filterbar select,.st-filterbar input{max-width:135px;min-width:75px;font-size:12px}}

/* Context-unavailable toolbar options stay visible but look inactive. */
.inline-tools .toolmenu button:disabled,
.inline-tools .toolmenu select:disabled,
.inline-tools .toolmenu button[aria-disabled="true"],
.inline-tools .toolmenu select[aria-disabled="true"]{
  opacity:.30!important;
  color:#9aa4b2!important;
  background:#273142!important;
  border-color:#465164!important;
  box-shadow:none!important;
  outline:none!important;
  filter:grayscale(1);
  cursor:not-allowed!important;
  text-shadow:none!important;
}
.inline-tools .toolmenu button:disabled:hover,
.inline-tools .toolmenu select:disabled:hover,
.inline-tools .toolmenu button[aria-disabled="true"]:hover,
.inline-tools .toolmenu select[aria-disabled="true"]:hover{
  opacity:.30!important;
  color:#9aa4b2!important;
  background:#273142!important;
  border-color:#465164!important;
}
/* Disabled state takes priority over the selected-option indicator. */
.inline-tools .toolmenu button.option-indicator-active:disabled,
.inline-tools .toolmenu select.option-indicator-active:disabled,
.inline-tools .toolmenu button.option-indicator-active[aria-disabled="true"],
.inline-tools .toolmenu select.option-indicator-active[aria-disabled="true"]{
  opacity:.30!important;
  color:#9aa4b2!important;
  background:#273142!important;
  border-color:#465164!important;
  box-shadow:none!important;
  outline:none!important;
  filter:grayscale(1);
  cursor:not-allowed!important;
}

<script>
(() => {
 const $=id=>document.getElementById(id); let bookId=null, activeSheet='Sheet1', selected='A1', data=[], sheets=[], editing=false;
 const COLS=20, ROWS=40; let reportingTables=[], activeSmartTable=null, smartFilters=[], selectedTableStyle='blue', quickFilterColumn=null, quickFilterText=null;
 function colName(n){let s='';while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
 function addr(c,r){return colName(c)+r}
 function setStatus(s){$('status').textContent=s}
 function rememberBook(){try{if(bookId)localStorage.setItem('niceexcel.lastWorkbookId',bookId)}catch{}}
 function forgetBook(){try{localStorage.removeItem('niceexcel.lastWorkbookId')}catch{}}
 async function api(path,options={}){const r=await fetch(path,options);if(!r.ok){let msg='Request failed ('+r.status+')';try{const j=await r.json();msg=j.detail||msg}catch{}throw Error(msg)}const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.blob()}
 function json(method,body){return {method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}}
 async function create(){const x=await api('/workbooks',json('POST',{sheet_name:'Sheet1'}));bookId=x.workbook_id;activeSheet=x.sheets[0];sheets=x.sheets;selected='A1';rememberBook();await refresh();setStatus('New workbook ready')}
 async function info(){const x=await api('/workbooks/'+bookId);sheets=x.sheets.map(s=>s.name);if(!sheets.includes(activeSheet))activeSheet=sheets[0]||'Sheet1';renderSheets();}
 async function refresh(){if(!bookId)return;const gridWrap=$('gridwrap');const savedTop=gridWrap?gridWrap.scrollTop:0;const savedLeft=gridWrap?gridWrap.scrollLeft:0;await info();const x=await api('/workbooks/'+bookId+'/range?sheet='+encodeURIComponent(activeSheet)+'&range=A1:T40');data=x.rows;try{const m=await api('/workbooks/'+bookId+'/reporting/metadata');reportingTables=(m.metadata?.tables||[]).filter(t=>t.sheet===activeSheet)}catch{reportingTables=[]}renderGrid();renderSmartTableFilters();syncFormula();if(gridWrap){gridWrap.scrollTop=savedTop;gridWrap.scrollLeft=savedLeft;}}
 function cellAt(a){const m=a.match(/^([A-Z]+)(\d+)$/);if(!m)return null;let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return {r:+m[2],c}}
 function cellData(a){const p=cellAt(a);return p&&data[p.r-1]&&data[p.r-1][p.c-1]}
 let frozenRows=1;
 function renderGrid(){const t=$('grid');t.innerHTML='';const thead=document.createElement('thead'),hr=document.createElement('tr');const corner=document.createElement('th');corner.textContent='▦';hr.append(corner);for(let c=1;c<=COLS;c++){const th=document.createElement('th');th.textContent=colName(c);hr.append(th)}thead.append(hr);t.append(thead);const tb=document.createElement('tbody');for(let r=1;r<=ROWS;r++){const tr=document.createElement('tr'),rh=document.createElement('th');rh.className='rowhead';rh.textContent=r;tr.append(rh);for(let c=1;c<=COLS;c++){const a=addr(c,r),obj=data[r-1]?.[c-1]||{value:null,style:{}};const td=document.createElement('td');td.dataset.addr=a;td.tabIndex=0;const displayValue=(typeof obj.value==='string'&&obj.value.startsWith('='))?obj.calculated_value:obj.value;const shownValue=Array.isArray(displayValue)?(Array.isArray(displayValue[0])?displayValue[0][0]:displayValue[0]):displayValue;td.textContent=shownValue==null?'':String(shownValue);td.title=obj.value==null?'':String(obj.value);if(obj.style){if(obj.style.bold)td.style.fontWeight='700';if(obj.style.italic)td.style.fontStyle='italic';if(obj.style.font_size)td.style.fontSize=obj.style.font_size+'px';if(obj.style.font_color)td.style.color='#'+obj.style.font_color.slice(-6);if(obj.style.fill_color)td.style.background='#'+obj.style.fill_color.slice(-6);if(obj.style.horizontal)td.style.textAlign=obj.style.horizontal;if(obj.number_format&&obj.number_format!=='General')td.dataset.numberFormat=obj.number_format}if(a===selected)td.classList.add('selected');td.addEventListener('click',()=>select(a));td.addEventListener('dblclick',()=>editCell(td));td.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='F2'){e.preventDefault();editCell(td)}else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&!editing){e.preventDefault();move(e.key)}});tr.append(td)}tb.append(tr)}t.append(tb);applyFrozenRows();applyQuickFilter()}
 function applyFrozenRows(){const t=$('grid');const head=t.tHead?.getBoundingClientRect().height||30;const rows=[...t.tBodies[0]?.rows||[]];let top=head;rows.forEach((tr,i)=>{const freeze=(i+1)<=frozenRows;tr.classList.toggle('freeze-row',freeze);if(freeze){tr.style.top=top+'px';[...tr.cells].forEach((cell,j)=>{cell.style.top=top+'px';cell.style.zIndex=j===0?'5':'1';});top+=tr.getBoundingClientRect().height;}else{tr.style.top='';[...tr.cells].forEach(cell=>{cell.style.top='';cell.style.zIndex='';});}})}
 function select(a){selected=a.toUpperCase();$('address').value=selected;document.querySelectorAll('td.selected').forEach(x=>x.classList.remove('selected'));const el=document.querySelector('td[data-addr="'+selected+'"]');if(el)el.classList.add('selected');syncFormula();$('selectionInfo').textContent=activeSheet+' · '+selected}
 // Paste tab/newline-separated clipboard data into a rectangular range (desktop and mobile).
 async function pasteTabularText(text){
   if(!bookId||!text)return false;
   const anchor=cellAt(selected);if(!anchor)return false;
   let normalized=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
   let rows=normalized.split('\n');if(rows.length&&rows[rows.length-1]==='')rows.pop();
   const matrix=rows.map(row=>row.split('\t'));
   if(!matrix.length||!matrix.some(row=>row.some(v=>v!=='')))return false;
   const maxCols=Math.max(...matrix.map(row=>row.length));
   if(anchor.r+matrix.length-1>ROWS||anchor.c+maxCols-1>COLS){alert('Pasted data exceeds the visible grid. Start at an earlier cell or paste a smaller range.');return false;}
   const cells=[];matrix.forEach((row,ri)=>row.forEach((value,ci)=>cells.push({cell:addr(anchor.c+ci,anchor.r+ri),value:value===''?null:value})));
   try{await api('/workbooks/'+bookId+'/cells',json('PATCH',{sheet:activeSheet,cells}));await refresh();select(addr(anchor.c,anchor.r));setStatus('Pasted '+matrix.length+' rows × '+maxCols+' columns');return true;}
   catch(e){alert('Paste failed: '+e.message);return false;}
 }
 const gridwrap=$('gridwrap');

 function scheduleFormulaPreview(){
   if(previewTimer)clearTimeout(previewTimer);
   const formula=$('formula').value, cell=$('address').value.trim().toUpperCase(), out=$('formulaPreview');
   const requestId=++previewRequest;

   out.textContent='Calculating preview…';out.style.color='var(--muted)';
   previewTimer=setTimeout(async()=>{
     if(!bookId||requestId!==previewRequest)return;
     try{const result=await api('/workbooks/'+bookId+'/formula-preview',json('POST',{sheet:activeSheet,cell,formula}));
       if(requestId!==previewRequest)return;
       const value=result.calculated_value;
       if(result.formula_error){out.textContent='Formula error: '+result.formula_error;out.style.color='#ff8a8a'}
       else{out.textContent='Preview result: '+(value===null||value===undefined?'':String(value));out.style.color='var(--green)'}
     }catch(e){if(requestId===previewRequest){out.textContent='Preview unavailable: '+e.message;out.style.color='#ff8a8a'}}
   },300);
 }

 // Each section toggles its own inline tools: first tap shows, second tap hides.
 (function setupCompactRibbon(){
   const header=document.querySelector('.web-native-toolbar');
   const groups=[...header.querySelectorAll('details.toolgroup')];
   const strip=document.createElement('div');
   strip.id='inlineTools'; strip.className='inline-tools'; strip.setAttribute('aria-label','Selected section tools');
   header.insertAdjacentElement('afterend',strip);
   let active=null;
   const shortLabels={copyCellBtn:'Copy',pasteCellBtn:'Paste',clearCellBtn:'Clear',fontSizeBtn:'Font size',clearFormatBtn:'Clear format',sortAscBtn:'Sort A→Z',sortDescBtn:'Sort Z→A',filterColumnBtn:'Filter',clearFilterBtn:'Clear filter',formulaPickerRibbonBtn:'ƒx Insert',newBtn:'＋ New',recoverBtn:'↻ Recover',openBtn:'Open XLSX',saveBtn:'Save XLSX',csvBtn:'Export CSV',undoBtn:'↶ Undo',redoBtn:'↷ Redo',homeFormatBtn:'Format…',findBtn:'Find',insertRowBtn:'＋ Row',addSheetMenu:'＋ Sheet',mergeBtn:'Merge',chartBtn:'Chart',smartTableBtn:'Smart Table',boldBtn:'B',italicBtn:'I',applyStyle:'Apply',findBtnData:'Find',retrieveDataBtn:'Retrieve',freezeBtn:'Freeze',dependenciesBtn:'Links',calculateBtn:'ƒx Calc',dependenciesBtnFormula:'Links',formulaHelpBtn:'Help',nativeExcelBtn:'Native Excel',workbookInfoBtn:'Info'};
   groups.forEach(group=>{
     const summary=group.querySelector('summary'), menu=group.querySelector('.toolmenu');
     summary.setAttribute('role','button'); summary.setAttribute('aria-label',summary.textContent.trim()+' tools');
     group.removeAttribute('open');
     group.querySelectorAll('.toolmenu button[id]').forEach(btn=>{const label=btn.textContent.trim();btn.title=label;btn.setAttribute('aria-label',label);if(shortLabels[btn.id])btn.textContent=shortLabels[btn.id];});
     group.querySelectorAll('.toolmenu select').forEach(el=>{el.style.maxWidth='118px';});
     summary.addEventListener('click',event=>{
       event.preventDefault();
       if(active===group){strip.classList.remove('visible');strip.replaceChildren();group.classList.remove('active');active=null;return;}
       groups.forEach(g=>g.classList.toggle('active',g===group));
       strip.replaceChildren(); if(menu)strip.appendChild(menu);
       strip.classList.add('visible'); active=group;
     });
   });
   // Cell selection does not close this strip; only tapping the same section hides it.

   // Keep a visible indicator on the most recently selected option inside a section.
   // Delegation survives moving each section's tool menu into the inline strip.
   // Capture selection before other toolbar handlers can stop bubbling.
    // Re-apply after the control's own click handler in case it updates its DOM/state.
    const markOptionIndicator=(event)=>{
      const option=event.target.closest('.inline-tools .toolmenu button, .inline-tools .toolmenu select');
      if(!option || !strip.contains(option)) return;
      const mark=()=>{
        if(!strip.contains(option)) return;
        strip.querySelectorAll('.toolmenu .option-indicator-active').forEach(el=>{
          if(el!==option) el.classList.remove('option-indicator-active');
        });
        option.classList.add('option-indicator-active');
        option.setAttribute('data-option-indicator','active');
      };
      mark();
      if(event.type==='click') window.setTimeout(mark,0);
    };
    strip.addEventListener('pointerdown',markOptionIndicator,true);
    strip.addEventListener('click',markOptionIndicator,true);
    strip.addEventListener('change',markOptionIndicator,true);
 })();


 function setupFormulaPicker(){
   const toggle=$('formulaPickerToggle'), panel=$('formulaPicker'), search=$('formulaSearch'), list=$('formulaList');
   if(!toggle||!panel||!search||!list)return;
   const close=()=>{panel.hidden=true;toggle.setAttribute('aria-expanded','false')};
   toggle.addEventListener('click',()=>{const opening=panel.hidden;panel.hidden=!opening;toggle.setAttribute('aria-expanded',String(opening));if(opening){search.value='';list.querySelectorAll('.formula-option').forEach(b=>b.hidden=false);search.focus();}});
   search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();list.querySelectorAll('.formula-option').forEach(b=>{b.hidden=!b.dataset.formula.toLowerCase().includes(q)});});
   list.addEventListener('click',event=>{const button=event.target.closest('.formula-option');if(!button)return;const name=button.dataset.formula;const input=$('formula');input.value='='+name+'(';input.focus();input.setSelectionRange(input.value.length,input.value.length);scheduleFormulaPreview();close();});
   document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!panel.hidden){close();toggle.focus();}});
 }
 setupFormulaPicker();

 startSession().catch(e=>{setStatus('API error: '+e.message);$('calcNote').textContent='Start backend at 127.0.0.1:8765; see backend README.'});
})();
