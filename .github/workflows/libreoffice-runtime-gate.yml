name: LibreOffice Integration Source Gate

on:
  pull_request:
    paths:
      - 'app/src/main/java/org/libreoffice/**'
      - 'app/src/main/java/com/meraj/niceexcel/LibreOffice*'
      - 'app/src/androidTest/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'app/src/main/java/com/meraj/niceexcel/MainActivity.kt'
      - 'native/libreoffice/runtime-manifest.json'
      - 'native-engine/THIRD-PARTY-LICENSES.md'
      - 'testdata/libreoffice/**'
      - 'scripts/validate_libreoffice_formula_fixture.py'
      - '.github/workflows/libreoffice-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libreoffice-source-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-test-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate formula fixture structure (not formula calculation)
        run: python3 scripts/validate_libreoffice_formula_fixture.py testdata/libreoffice/formula-cases.json

      - name: Compile JVM and Android instrumentation tests
        run: |
          gradle --no-daemon testDebugUnitTest
          gradle --no-daemon assembleDebugAndroidTest
