name: LibreOffice Calc Real-Phone Formula Acceptance

on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: "Successful Build NiceExcel APK with LibreOffice ARM64 workflow Run ID"
        required: true
        type: string
  workflow_run:
    workflows: ["Build NiceExcel APK with LibreOffice ARM64"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  arm64-phone-formula-tests:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, windows, x64, niceexcel-android-device]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android platform tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Download LibreOffice-enabled ARM64 app APK
        uses: actions/download-artifact@v4
        with:
          name: NiceExcel-LibreOffice-ARM64-debug-apk
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.apk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/app

      - name: Download LibreOffice formula instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: NiceExcel-LibreOffice-ARM64-debug-tests
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.apk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/tests

      - name: Verify connected physical ARM64 phone
        shell: pwsh
        run: |
          $adb = Join-Path $env:ANDROID_HOME "platform-tools/adb.exe"
          if (!(Test-Path $adb)) { throw "adb.exe not found under ANDROID_HOME" }
          & $adb start-server
          & $adb devices -l
          $online = @(& $adb devices | Select-String "\sdevice$")
          if ($online.Count -ne 1) { throw "Connect exactly one authorized Android phone; found $($online.Count) online devices." }
          $abi = (& $adb shell getprop ro.product.cpu.abi).Trim()
          $android = (& $adb shell getprop ro.build.version.release).Trim()
          $model = (& $adb shell getprop ro.product.model).Trim()
          Write-Host "Connected phone: $model / Android $android / ABI $abi"
          if ($abi -ne "arm64-v8a") { throw "LibreOffice core is arm64-v8a only; connected device reports $abi" }
          "ANDROID_ADB=$adb" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install app and instrumentation APKs
        shell: pwsh
        run: |
          $app = Get-ChildItem artifacts/app -Filter *.apk -Recurse | Select-Object -First 1
          $tests = Get-ChildItem artifacts/tests -Filter *.apk -Recurse | Select-Object -First 1
          if (!$app -or !$tests) { throw "App APK or instrumentation APK is missing." }
          & $env:ANDROID_ADB install -r $app.FullName
          if ($LASTEXITCODE -ne 0) { throw "Failed to install NiceExcel app APK." }
          & $env:ANDROID_ADB install -r $tests.FullName
          if ($LASTEXITCODE -ne 0) { throw "Failed to install NiceExcel instrumentation APK." }
          & $env:ANDROID_ADB logcat -c

      - name: Run actual LibreOffice Calc formula tests on phone
        shell: pwsh
        run: |
          $output = & $env:ANDROID_ADB shell am instrument -w -r com.meraj.niceexcel.test/androidx.test.runner.AndroidJUnitRunner 2>&1
          $output | Tee-Object -FilePath instrumentation-output.txt
          if ($LASTEXITCODE -ne 0 -or -not ($output -match "OK \(2 tests\)")) {
            throw "LibreOffice Calc instrumentation tests did not report OK (2 tests)."
          }

      - name: Verify Calc native calculation evidence
        if: always()
        shell: pwsh
        run: |
          & $env:ANDROID_ADB logcat -d -s NiceExcel-LO-Calc:I NiceExcel-LO-Service:I NiceExcel-LO-IPC:I AndroidRuntime:E |
            Out-File -FilePath libreoffice-phone-logcat.txt -Encoding utf8
          if (Test-Path instrumentation-output.txt) {
            Get-Content instrumentation-output.txt
          }
          if (Test-Path libreoffice-phone-logcat.txt) {
            Get-Content libreoffice-phone-logcat.txt
          }
          if (Test-Path instrumentation-output.txt) {
            $log = Get-Content libreoffice-phone-logcat.txt -Raw
            if ($log -notmatch "CALC_COMMAND_SUCCESS" -or $log -notmatch "CALC_SAVE_REOPEN_OK") {
              Write-Error "Missing native Calc command/save-reopen evidence in phone logcat."
              exit 1
            }
          }

      - name: Upload physical-phone test report and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-LibreOffice-real-phone-test-report
          path: |
            instrumentation-output.txt
            libreoffice-phone-logcat.txt
          if-no-files-found: warn
          retention-days: 30
