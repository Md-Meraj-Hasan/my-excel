
name: NiceExcel Core Tests (LibreOffice APK uses the dedicated workflow)

"on":
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Setup Python for Flask backend tests
      - name: Setup Python for Flask backend tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5. Install and test Flask backend
      - name: Install and test Flask backend
        env:
          PYTHONPATH: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pytest -q backend/tests

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # This workflow intentionally does not publish an APK without the bundled Calc runtime.
      - name: Validate Calc formula fixture (schema only; not a calculation test)
        run: python3 scripts/validate_libreoffice_formula_fixture.py testdata/libreoffice/formula-cases.json

      # Run Android unit tests
      - name: Run local unit tests
        run: gradle --no-daemon testDebugUnitTest

