
name: Build Nice Excel APK

"on":
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Setup Python for Flask backend tests
      - name: Setup Python for Flask backend tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5. Install and test Flask backend
      - name: Install and test Flask backend
        env:
          PYTHONPATH: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pytest -q backend/tests

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 7. Verify Chaquopy ABI configuration
      - name: Verify Chaquopy ABI configuration
        shell: bash
        run: |
          if ! grep -Eq 'abiFilters[[:space:]]*.*arm64-v8a' app/build.gradle; then
            echo "ERROR: app/build.gradle must configure ndk.abiFilters inside android.defaultConfig."
            echo "Required ABIs should include arm64-v8a."
            exit 1
          fi
          echo "Chaquopy ABI configuration check passed."

      # 8. Run Android unit tests
      - name: Run local unit tests
        run: gradle --no-daemon testDebugUnitTest

      # 9. Build debug APK
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # 10. Upload APK
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
